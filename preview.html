            {/* TENTANG KAMI & LAYANAN */}
            <section className="py-12 px-6 bg-[#1e293b] text-white">
              <div className="mb-10 text-center">
                <span className="text-[#c98e3b] text-xs font-bold tracking-widest uppercase mb-2 block">Layanan Kami</span>
                <h2 className="text-2xl font-extrabold tracking-tight">Solusi Konstruksi Terpadu</h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {pageData.services.map((service, idx) => (
                  <div key={idx} className="bg-slate-800/50 border border-slate-700 p-5 rounded-2xl hover:bg-slate-800 transition-colors">
                    <div className="text-[#c98e3b] mb-4 bg-slate-900 inline-block p-3 rounded-xl">
                      {renderIcon(service.icon)}
                    </div>
                    <h3 className="font-bold text-lg mb-2">{service.name}</h3>
                    <p className="text-slate-400 text-sm leading-relaxed">{service.desc}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* HISTORY / PERJALANAN KAMI */}
            <section className="py-12 px-6 bg-slate-50 relative">
              <div className="mb-10 text-center">
                <span className="text-[#c98e3b] text-xs font-bold tracking-widest uppercase mb-2 block">Sejarah Kencana Graha</span>
                <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Perjalanan Kami</h2>
              </div>

              <div className="relative border-l-2 border-[#c98e3b]/30 ml-3 md:ml-6 space-y-8 pb-4">
                {pageData.history.map((hist, idx) => (
                  <div key={idx} className="relative pl-8">
                    <div className="absolute w-4 h-4 bg-[#c98e3b] rounded-full -left-[9px] top-1 shadow-md shadow-[#c98e3b]/40 border-2 border-white"></div>
                    <span className="text-xs font-extrabold text-[#c98e3b] bg-[#c98e3b]/10 px-3 py-1 rounded-full mb-2 inline-block">{hist.year}</span>
                    <h3 className="text-lg font-bold text-slate-900 mb-1">{hist.title}</h3>
                    <p className="text-slate-500 text-sm leading-relaxed">{hist.desc}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* KATALOG / PORTOFOLIO */}
            <section className="py-12 px-6 bg-white border-y border-slate-200">
              <div className="mb-8 flex flex-col gap-1 items-center text-center">
                <span className="text-[#c98e3b] text-xs font-bold tracking-widest uppercase mb-1">Portofolio</span>
                <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Karya Terbaik Kami</h2>
                <p className="text-slate-500 text-sm mt-2 max-w-sm">Jelajahi hasil karya konstruksi dan interior yang telah kami selesaikan.</p>
              </div>

              <div className="flex justify-center gap-2 mb-6">
                {['Semua', 'Eksterior', 'Interior'].map(cat => (
                  <button 
                    key={cat}
                    onClick={() => setActiveFilter(cat)}
                    className={`px-5 py-2 rounded-full text-xs font-bold transition-all border ${
                      activeFilter === cat 
                      ? 'bg-[#1e293b] text-white border-[#1e293b]' 
                      : 'bg-white text-slate-500 border-slate-300 hover:bg-slate-50'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
              
              <div className="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-6 no-scrollbar">
                {filteredCatalog.map((item, idx) => (
                  <div 
                    key={idx}
                    onClick={() => openLightbox(filteredCatalog.map(i => i.img), idx)}
                    className="group snap-center shrink-0 w-[260px] aspect-square rounded-2xl overflow-hidden cursor-pointer relative shadow-sm border border-slate-100"
                  >
                    <img 
                      src={item.img} 
                      alt={item.title} 
                      className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out"
                      loading="lazy"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                      <span className="text-[#e2a856] text-[10px] font-bold uppercase tracking-wider">{item.category}</span>
                      <span className="text-white text-sm font-semibold leading-tight mt-1">{item.title}</span>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* HARGA / PAKET */}
            <section className="py-12 px-6 bg-slate-50">
              <div className="mb-10 flex flex-col items-center text-center">
                <span className="text-[#c98e3b] text-xs font-bold tracking-widest uppercase mb-2 block">Estimasi Biaya</span>
                <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Paket Layanan</h2>
              </div>

              <div className="flex flex-col gap-5">
                {pageData.pricing.map((paket, idx) => (
                  <div key={idx} className={`bg-white border p-6 rounded-2xl shadow-sm relative overflow-hidden ${idx === 1 ? 'border-[#c98e3b] shadow-md' : 'border-slate-200'}`}>
                    {idx === 1 && (
                      <div className="absolute top-4 right-4 bg-[#c98e3b]/10 text-[#c98e3b] text-[10px] font-extrabold uppercase px-3 py-1 rounded-full tracking-wider">
                        Terpopuler
                      </div>
                    )}
                    <h3 className="text-lg font-bold text-slate-900 mb-1">{paket.name}</h3>
                    <div className="text-2xl font-extrabold text-[#c98e3b] mb-4">{paket.price}</div>
                    
                    <ul className="space-y-3">
                      {paket.features.map((feat, i) => (
                        <li key={i} className="flex items-start gap-3">
                          <CheckCircle2 size={18} className="text-emerald-500 shrink-0 mt-0.5" />
                          <span className="text-sm text-slate-600">{feat}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            </section>

            {/* LOKASI */}
            <section className="py-12 px-6 bg-white border-t border-slate-200">
              <div className="mb-6">
                <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                  <MapPin className="text-[#c98e3b]" /> Lokasi Kantor
                </h2>
              </div>
              <div className="w-full h-48 bg-slate-200 rounded-2xl overflow-hidden mb-4 relative">
                <img 
                  src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&q=80&w=600&h=300" 
                  alt="Map placeholder" 
                  className="w-full h-full object-cover opacity-60" 
                />
                <div className="absolute inset-0 flex items-center justify-center">
                    <a 
                      href={pageData.links.maps} 
                      target="_blank" 
                      rel="noreferrer"
                      className="bg-[#1e293b] text-white px-5 py-3 rounded-full text-sm font-bold shadow-lg hover:bg-slate-800 transition-colors flex items-center gap-2"
                    >
                      Buka di Google Maps
                    </a>
                </div>
              </div>
              <p className="text-slate-600 text-sm">{pageData.address}</p>
            </section>

            {/* FAQ */}
            <section className="py-12 px-6 bg-slate-50 border-t border-slate-200">
              <div className="mb-8">
                <span className="text-[#c98e3b] text-xs font-bold tracking-widest uppercase mb-2 block">Bantuan</span>
                <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Pertanyaan Umum (FAQ)</h2>
              </div>

              <div className="flex flex-col gap-3">
                {pageData.faqs.map((faq, idx) => (
                  <div 
                    key={idx} 
                    className="bg-white border border-slate-200 rounded-xl overflow-hidden transition-all duration-300"
                  >
                    <button 
                      onClick={() => setActiveFAQ(activeFAQ === idx ? null : idx)}
                      className="w-full flex items-center justify-between p-5 text-left focus:outline-none"
                    >
                      <span className="font-semibold text-slate-800 text-sm pr-4">{faq.q}</span>
                      {activeFAQ === idx ? (
                        <ChevronUp size={18} className="text-[#c98e3b] shrink-0" />
                      ) : (
                        <ChevronDown size={18} className="text-slate-400 shrink-0" />
                      )}
                    </button>
                    <div 
                      className={`px-5 overflow-hidden transition-all duration-300 ${activeFAQ === idx ? 'max-h-40 pb-5 opacity-100' : 'max-h-0 opacity-0'}`}
                    >
                      <p className="text-sm text-slate-500 leading-relaxed">{faq.a}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* TESTIMONI */}
            <section className="py-12 px-6 bg-[#1e293b] text-white overflow-hidden">
              <div className="mb-10 text-center">
                <h2 className="text-2xl font-extrabold tracking-tight flex items-center justify-center gap-2">
                  <Quote className="text-[#c98e3b]" /> Ulasan Klien
                </h2>
              </div>

              <div className="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-6 no-scrollbar">
                {pageData.testimonials.map((testi, idx) => (
                  <div key={idx} className="snap-center shrink-0 w-[280px] bg-slate-800/80 p-6 rounded-3xl border border-slate-700 flex flex-col gap-4">
                    <div className="flex items-center gap-1">
                      {[...Array(testi.rating)].map((_, i) => (
                        <Star key={i} size={14} className="fill-[#c98e3b] text-[#c98e3b]" />
                      ))}
                    </div>
                    <p className="text-slate-300 text-sm leading-relaxed italic">"{testi.text}"</p>
                    <div className="mt-auto pt-4 border-t border-slate-700">
                      <span className="block text-[13px] font-bold text-white">{testi.name}</span>
                      <span className="block text-[11px] text-slate-400 mt-0.5">{testi.role}</span>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* BOOKING/KONSULTASI FORM */}
            <section id="konsultasi-form" className="py-16 px-6 bg-white">
              <div className="bg-[#1e293b] rounded-[2rem] p-8 shadow-xl relative overflow-hidden text-white">
                <div className="absolute -top-24 -right-24 w-48 h-48 bg-[#c98e3b]/20 rounded-full pointer-events-none blur-2xl"></div>
                <div className="absolute -bottom-24 -left-24 w-48 h-48 bg-[#c98e3b]/20 rounded-full pointer-events-none blur-2xl"></div>
                
                <div className="relative z-10 mb-8 text-center">
                  <h2 className="text-2xl font-extrabold mb-2">Mulai Proyek Anda</h2>
                  <p className="text-slate-300 text-sm leading-relaxed">Ceritakan rencana bangun atau renovasi Anda. Tim ahili kami siap memberikan estimasi biaya dan konsultasi gratis.</p>
                </div>
                
                <form onSubmit={handleFormSubmit} className="flex flex-col gap-4 relative z-10">
                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wide ml-1">Nama Lengkap</label>
                    <input 
                      type="text" 
                      name="name" 
                      required
                      placeholder="Masukkan nama Anda"
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#c98e3b] transition-all"
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wide ml-1">Jenis Layanan</label>
                    <select 
                      name="service" 
                      required
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-[#c98e3b] transition-all appearance-none"
                    >
                      <option value="">Pilih layanan...</option>
                      <option value="Bangun Rumah Baru">Bangun Rumah Baru</option>
                      <option value="Renovasi Total">Renovasi Total</option>
                      <option value="Desain & Build Interior">Desain & Build Interior</option>
                      <option value="Fasad & Eksterior">Fasad & Eksterior</option>
                      <option value="Hanya Desain/Arsitektur">Hanya Desain/Arsitektur</option>
                    </select>
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wide ml-1">Lokasi Proyek</label>
                    <input 
                      type="text" 
                      name="location" 
                      required
                      placeholder="Kota/Kecamatan (cth: Kebayoran Baru)"
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#c98e3b] transition-all"
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wide ml-1">Deskripsi Singkat (Opsional)</label>
                    <textarea 
                      name="notes" 
                      rows="3"
                      placeholder="Cth: Ingin bangun rumah 2 lantai luas tanah 100m2..."
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#c98e3b] transition-all resize-none"
                    ></textarea>
                  </div>

                  <button 
                    type="submit"
                    className="w-full mt-4 bg-[#25D366] text-slate-900 font-extrabold text-sm tracking-wide py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-[#20b858] transition-colors shadow-lg"
                  >
                    Kirim via WhatsApp
                    <MessageCircle size={20} className="text-slate-900" />
                  </button>
                </form>
              </div>
            </section>

            {/* FOOTER */}
            <footer className="pt-8 pb-12 text-center flex flex-col items-center justify-center mx-6 mt-4">
              <div className="w-full h-px bg-slate-200 mb-8"></div>
              
              <div className="w-16 h-16 bg-white rounded-full shadow-sm border border-slate-200 flex items-center justify-center mb-4 p-1 overflow-hidden">
                <img src={pageData.profileImg} alt="Footer Logo" className="w-full h-full object-contain rounded-full" />
              </div>
              
              <div className="text-slate-500 text-xs flex flex-col gap-1 items-center">
                <span className="font-extrabold text-slate-900 text-sm">{pageData.name}</span>
                <span className="max-w-[250px]">{pageData.address}</span>
              </div>

              <p className="text-slate-400 text-[10px] mt-8">
                © {new Date().getFullYear()} {pageData.name}. All rights reserved.
              </p>
              
              <a 
                href="https://www.solusilokal.id" 
                target="_blank" 
                rel="noopener noreferrer"
                className="text-slate-400 text-[10px] mt-2 tracking-wide font-medium hover:text-slate-700 transition-colors"
              >
                powered by solusilokal.id
              </a>
            </footer>

            {/* STICKY CTA */}
            <div 
              className={`fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-[600px] z-40 transition-all duration-500 ease-out ${
                showStickyCTA ? 'translate-y-0 opacity-100' : 'translate-y-24 opacity-0 pointer-events-none'
              }`}
            >
              <button 
                onClick={scrollToForm}
                className="w-full flex items-center justify-between px-6 py-4 bg-[#1e293b] backdrop-blur-xl border border-[#c98e3b]/30 rounded-2xl text-white shadow-2xl hover:bg-slate-800 active:scale-[0.98] transition-all"
              >
                <span className="font-bold text-sm tracking-wide text-white">Konsultasi Sekarang</span>
                <div className="bg-[#c98e3b] text-white p-2 rounded-xl">
                  <CalendarCheck size={18} />
                </div>
              </button>
            </div>

          </main>

          {/* LIGHTBOX MODAL */}
          {lightbox.isOpen && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/95 backdrop-blur-xl"
              onClick={closeLightbox}
            >
              <button 
                className="absolute top-6 right-6 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-all z-50 border border-white/20"
                onClick={closeLightbox}
              >
                <X size={20} />
              </button>

              {lightbox.images.length > 1 && (
                <button 
                  className="absolute left-4 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-all z-50 border border-white/20"
                  onClick={prevImage}
                >
                  <ChevronLeft size={24} />
                </button>
              )}

              <div className="w-full max-w-4xl max-h-[100dvh] p-4 flex items-center justify-center" onClick={(e) => e.stopPropagation()}>
                <img 
                  src={lightbox.images[lightbox.currentIndex]} 
                  alt="Lightbox View" 
                  className="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl"
                />
              </div>

              {lightbox.images.length > 1 && (
                <button 
                  className="absolute right-4 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-all z-50 border border-white/20"
                  onClick={nextImage}
                >
                  <ChevronRight size={24} />
                </button>
              )}
              
              {lightbox.images.length > 1 && (
                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-white text-xs font-bold tracking-[0.2em] bg-white/10 px-4 py-2 rounded-full backdrop-blur-md border border-white/20">
                  {lightbox.currentIndex + 1} / {lightbox.images.length}
                </div>
              )}
            </div>
          )}

          {/* SHARE MODAL */}
          {showShareModal && (
            <div
              className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/60 backdrop-blur-sm sm:items-center transition-opacity"
              onClick={() => setShowShareModal(false)}
            >
              <div
                className="w-full max-w-[480px] bg-white sm:rounded-3xl rounded-t-3xl p-6 relative overflow-hidden duration-300 shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex justify-center items-center mb-6 relative">
                  <h3 className="text-slate-900 font-bold text-[15px]">Bagikan Kencana Graha</h3>
                  <button
                    onClick={() => setShowShareModal(false)}
                    className="absolute right-0 p-1 text-slate-500 hover:bg-slate-100 rounded-full transition-all"
                  >
                    <X size={20} />
                  </button>
                </div>

                <div className="flex overflow-x-auto gap-3 pb-2 no-scrollbar items-start px-1 mb-4 justify-center">
                  <div className="flex flex-col items-center gap-2 min-w-[76px]">
                    <button
                      onClick={copyToClipboard}
                      className="w-[60px] h-[60px] rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition-all shadow-sm border border-slate-200"
                    >
                      {copied ? <Check size={26} className="text-green-600" /> : <Copy size={26} />}
                    </button>
                    <span className="text-[11px] font-semibold text-slate-600 text-center">
                      {copied ? 'Tersalin' : 'Salin'}
                    </span>
                  </div>
                  <div className="flex flex-col items-center gap-2 min-w-[76px]">
                    <button
                      onClick={() => window.open(`https://wa.me/?text=${encodeURIComponent(pageData.title + ' ' + window.location.href)}`, '_blank')}
                      className="w-[60px] h-[60px] rounded-full bg-[#25D366] flex items-center justify-center text-white hover:brightness-110 transition-all shadow-sm"
                    >
                      <MessageCircle size={26} className="text-white" />
                    </button>
                    <span className="text-[11px] font-semibold text-slate-600 text-center">WhatsApp</span>
                  </div>
                </div>
                
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
